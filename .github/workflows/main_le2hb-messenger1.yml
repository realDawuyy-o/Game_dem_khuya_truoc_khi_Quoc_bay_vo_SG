name: Build and deploy Go app to Azure Web App - le2hb-messenger1

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Build Go backend for Linux
        working-directory: ./server
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../app .

      - name: Build web frontend (if package.json exists)
        run: |
          if [ -f web/package.json ]; then
            cd web
            npm ci || npm install
            npm run build --if-present
          fi

      - name: Package app for deployment
        run: zip -r release.zip app web sound_library -x "web/node_modules/*"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: go-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'le2hb-messenger1'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
