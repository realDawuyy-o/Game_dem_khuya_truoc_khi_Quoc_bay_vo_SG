name: Build and deploy Node.js app to Azure Web App - le2hb-messenger1

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install server dependencies
        working-directory: ./server
        run: |
          if [ -f package-lock.json ]; then
            npm ci --omit=dev
          else
            npm install --omit=dev
          fi

      - name: Build web frontend (if package.json exists)
        run: |
          if [ -f web/package.json ]; then
            cd web
            npm ci || npm install
            npm run build --if-present
          fi

      - name: Package app for deployment
        run: zip -r release.zip server web sound_library -x "web/node_modules/*"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download deployment artifact
        uses: actions
